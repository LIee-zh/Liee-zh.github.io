name: add-site-files

on:
  push:
    paths:
      - run-site-files.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the site files
        run: |
          mkdir -p images
          curl -LfsS -o index.html "https://aka.doubaocdn.com/s/zyR161j94C"
          curl -LfsS -o classes.html "https://aka.doubaocdn.com/s/YWsVpcGAwF"
          curl -LfsS -o visit.html "https://aka.doubaocdn.com/s/zvyK7M9NKw"
          curl -LfsS -o styles.css "https://aka.doubaocdn.com/s/IS10Fwi9YA"
          curl -LfsS -o images/hero-cafe.jpg "https://aka.doubaocdn.com/s/PVA32aVqOr"
          curl -LfsS -o images/class-group.jpg "https://aka.doubaocdn.com/s/SuHWMlYs1E"
          curl -LfsS -o images/food-latte.jpg "https://aka.doubaocdn.com/s/Q02HmpYo99"
          curl -LfsS -o images/store-chengdu.jpg "https://aka.doubaocdn.com/s/BrQoVZsXCG"
          ls -l images

      - name: Commit and push
        run: |
          git config user.name "LIee-zh"
          git config user.email "2855163338@qq.com"
          rm -f images/.gitkeep
          git add -A
          git commit -m "Add Fit & Sip Studio site files and images" || echo "nothing to commit"
          git push

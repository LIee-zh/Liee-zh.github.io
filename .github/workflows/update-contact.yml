name: update-contact

on:
  push:
    paths:
      - run-site-files.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the updated pages
        run: |
          curl -LfsS -o index.html "https://aka.doubaocdn.com/s/PuWa7wLyW0"
          curl -LfsS -o classes.html "https://aka.doubaocdn.com/s/Sti4xiXJUY"
          curl -LfsS -o visit.html "https://aka.doubaocdn.com/s/q1dj9pBFg8"
          wc -c index.html classes.html visit.html

      - name: Commit and push
        run: |
          git config user.name "LIee-zh"
          git config user.email "2855163338@qq.com"
          git add -A
          git commit -m "Update contact phone and e-mail on all pages" || echo "nothing to commit"
          git push
